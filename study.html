
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>독서 활동 기록장</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #4a76d1;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #345bb0;
        }

        .char-count {
            text-align: right;
            margin-top: 6px;
            color: #666;
            font-size: 13px;
        }

        .char-count.over {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 독서 활동 기록장</h1>

        <form
            id="readingForm"
            method="POST"
            action="https://script.google.com/macros/s/AKfycbwlOQ6pwXvEDskOHasl8BSPnqj5Cm3qpDCS7Cho4Qd4gB33CFp3LE0JJRujwz6OXp7A/exec"
        >

            <!-- F1: 책 제목 -->
            <label for="bookTitle">책 제목</label>

            <input
                type="text"
                id="bookTitle"
                name="bookTitle"
            >

            <!-- F2: 독서 시간 -->
            <label for="readingMinutes">
                독서 시간(분)
            </label>

            <input
                type="number"
                id="readingMinutes"
                name="readingMinutes"
            >

            <!-- F3: 한 줄 감상 -->
            <label for="review">한 줄 감상</label>

            <textarea
                id="review"
                name="review"
                maxlength="100"
            ></textarea>

            <!-- 실시간 글자 수 표시 -->
            <div id="charCount" class="char-count">
                0/100
            </div>

            <button type="submit">
                기록 저장
            </button>

        </form>

    </div>


    <script>

        // 입력 요소 가져오기
        const form = document.getElementById("readingForm");

        const bookTitle = document.getElementById("bookTitle");

        const readingMinutes =
            document.getElementById("readingMinutes");

        const review = document.getElementById("review");

        const charCount = document.getElementById("charCount");


        // F3: 실시간 글자 수 표시
        review.addEventListener("input", function() {

            const length = Array.from(review.value).length;

            charCount.textContent = length + "/100";

            // 100자를 초과하면 빨간색 표시
            if (length > 100) {
                charCount.classList.add("over");
            } else {
                charCount.classList.remove("over");
            }

        });


        // 기록 저장 버튼 클릭 시 검사
        form.addEventListener("submit", function(event) {

            // 기본 제출 중단
            event.preventDefault();


            // F1: 책 제목 공란 및 공백 검사
            if (bookTitle.value.trim() === "") {

                alert("책 제목을 입력해 주세요.");

                bookTitle.focus();

                return;
            }


            // F1: 독서 시간 미입력 검사
            if (readingMinutes.value.trim() === "") {

                alert("독서 시간을 입력해 주세요.");

                readingMinutes.focus();

                return;
            }


            // F2: 독서 시간 정수 검사
            const minutes = Number(readingMinutes.value);

            if (!Number.isInteger(minutes)) {

                alert("독서 시간은 정수로 입력해 주세요.");

                readingMinutes.focus();

                return;
            }


            // F2: 독서 시간 범위 검사
            if (minutes < 1 || minutes > 180) {

                alert("독서 시간은 1분부터 180분까지 입력할 수 있습니다.");

                readingMinutes.focus();

                return;
            }


            // F1: 한 줄 감상 공란 및 공백 검사
            if (review.value.trim() === "") {

                alert("한 줄 감상을 입력해 주세요.");

                review.focus();

                return;
            }


            // F3: 감상 글자 수 계산
            const length = Array.from(review.value).length;


            // F3: 최소 글자 수 검사
            if (length < 10) {

                alert("한 줄 감상은 최소 10자 이상 입력해 주세요.");

                review.focus();

                return;
            }


            // F3: 최대 글자 수 검사
            if (length > 100) {

                alert("한 줄 감상은 최대 100자까지 입력할 수 있습니다.");

                review.focus();

                return;
            }


            // 모든 검사 통과 시 실제 POST 제출
            form.submit();

        });

    </script>

</body>
</html>
